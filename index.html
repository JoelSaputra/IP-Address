<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">  
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  
  <title>Frontend Mentor | IP Address Tracker</title>


</head>
<body>

  <div class="upper-bar">
    <h1 class="upper-bar-title">IP Address Tracker</h1>

    <form class="search-bar" onsubmit="return false">
      <input class="search-bar-type" type="search" placeholder="Search for any IP address or domain"/>
      <button class="submit-button" type="submit">
        <img src="images/icon-arrow.svg" alt="arrow">
        </button>
    </form>
  </div>

  <div class="info-card">
    <div class="partition">
      <p class="partition-title">IP ADDRESS</p>
      <h2 class="partition-answer" id="partition-ip">
        test
      </h2>

    </div>

    <hr class="vertical-line-ip">

    <div class="partition">
      <p class="partition-title">LOCATION</p>
      <h2 class="partition-answer" id="partition-location">
        test
      </h2>

    </div>

    <hr class="vertical-line-location">

    <div class="partition">
      <p class="partition-title">TIMEZONE</p>
      <h2 class="partition-answer" id="partition-timezone">
        test
      </h2>

    </div>

    <hr class="vertical-line-timezone">

    <div class="partition">
      <p class="partition-title">ISP</p>
      <h2 class="partition-answer" id="partition-isp">
        test
      </h2>

    </div>



  
   
  </div>

  <div class="map">

    
  </div>






  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>

  <script src="script.js"></script>
</body>
</html>
